server:
  port: ${PORT:8081}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
spring:
  application:
    name: clinicflow-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinicflow}
    username: ${SPRING_DATASOURCE_USERNAME:clinicflow}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
  sql:
    init:
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
clinicflow:
  bootstrap:
    enabled: ${CLINICFLOW_BOOTSTRAP_ENABLED:false}
    admin-email: ${CLINICFLOW_BOOTSTRAP_EMAIL:}
    admin-password: ${CLINICFLOW_BOOTSTRAP_PASSWORD:}
    clinic-name: ${CLINICFLOW_BOOTSTRAP_CLINIC:}
  invites:
    ttl-hours: ${CLINICFLOW_INVITE_TTL_HOURS:72}
